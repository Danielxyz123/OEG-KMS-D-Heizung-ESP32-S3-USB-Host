; OEG KMS-D -> ESP32-S3 (USB-Host) -> MQTT / Home Assistant
;
; Erstes Flashen und Serial-Monitor ueber den "UART/COM"-Port des DevKits:
;     pio run -e esp32-s3-devkitc-1 -t upload
; Danach Updates ueber WLAN (OTA):
;     pio run -e ota -t upload
;
; Der native "USB"-Port wird zur Laufzeit als USB-Host fuer den Regler benutzt.

[platformio]
; Hinweis: Liegt das Projekt in einem Pfad mit Leerzeichen, scheitert der Build
; ("PubSubClient.h not found"). Dann diese Zeile aktivieren:
; workspace_dir = ${sysenv.TEMP}/oeg_kmsd_pio
default_envs = esp32-s3-devkitc-1
; OTA-Passwort (nicht eingecheckt, Vorlage: secrets.ini.example)
extra_configs = secrets.ini

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    -DCORE_DEBUG_LEVEL=2
    '-DOTA_PASS="${ota.password}"'

[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
; Hostname per mDNS; falls das nicht aufloest, hier die IP eintragen
upload_port = oeg-kmsd.local
; Der ESP verbindet sich fuer die Daten zurueck zum PC: diesen TCP-Port
; in der Windows-Firewall eingehend freigeben (siehe README).
upload_flags =
    --auth=${ota.password}
    --host_port=32233
